.count{color:var(--muted);font-size:13px}

.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.doc{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px 16px;border-top:1px solid var(--line)}
.doc:first-child{border-top:0}
.doc>div{min-width:0}
.doc h3{font:600 15px/1.35 var(--body);margin:0 0 5px}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

function size(kb){ return kb >= 1024 ? (kb/1024).toFixed(1)+" MB" : kb+" KB"; }

      '<article class="doc"><div><h3>'+esc(d.t)+'</h3><div class="meta"><span class="tag '+d.k+'">'+(d.k==="R"?"R&amp;R":"GUIDELINE")+'</span>'+
      (d.v?'<span>'+esc(d.v)+'</span>':'')+'<span>'+d.p+' page'+(d.p>1?'s':'')+'</span><span>'+d.ext+' · '+size(d.kb)+'</span></div></div>'+
      '<div class="acts"><a class="btn primary" href="'+encodeURI(d.view)+'" target="_blank" rel="noopener">View</a>'+
      '<a class="btn" href="'+encodeURI(d.dl)+'" download>Download</a></div></article>').join("")+'</div></section>';
  }).join("");
}
$("#q").addEventListener("input", e => { state.q = e.target.value; render(); });
document.querySelector(".seg").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  state.k = b.dataset.k; document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", x === b)); render();
});
$("#chips").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  state.s = b.dataset.s; chips(); render();
});
chips(); render();
</script>
</body>
</html>
